<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOC License Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --p: #00f2ff;
            --bg: #020617;
            --card: rgba(30, 41, 59, 0.5);
            --text: #f8fafc;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        label {
            display: block;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--p);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--p);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.96);
        }
        .result-container {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 12px;
            display: none;
            text-align: center;
        }
        .result-title {
            font-size: 0.7rem;
            color: var(--p);
            font-weight: 700;
            margin-bottom: 5px;
        }
        .result-key {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 License Generator</h1>
        
        <label>MAC ADDRESS JENDRAL (Tanpa Titik Dua)</label>
        <input type="text" id="mac" placeholder="Contoh: AABBCCDDEEFF" maxlength="12">
        
        <label>TANGGAL KADALUARSA</label>
        <input type="date" id="expDate">
        
        <label>SECRET SALT (Samakan dengan di ESP32)</label>
        <input type="text" id="salt" value="VOC_SECRET_SALT">
        
        <button onclick="generate()">GENERATE KEY</button>
        
        <div class="result-container" id="resultBox">
            <div class="result-title">SERIAL NUMBER ANDA:</div>
            <div class="result-key" id="resultKey"></div>
            <p style="font-size: 0.65rem; color: rgba(255,255,255,0.4); margin-top: 5px;">Salin kode di atas dan masukkan ke Jendral.</p>
        </div>
    </div>

    <script>
        function generate() {
            var mac = document.getElementById('mac').value.toUpperCase().trim();
            var dateInput = document.getElementById('expDate').value; // YYYY-MM-DD
            var salt = document.getElementById('salt').value;
            
            if (!mac || !dateInput || !salt) {
                alert('Harap isi semua kolom!');
                return;
            }
            
            if (mac.length !== 12) {
                alert('MAC Address harus 12 karakter (Hex)!');
                return;
            }
            
            var dateStr = dateInput.replace(/-/g, ''); // YYYYMMDD
            
            var dataToHash = salt + mac + dateStr;
            
            // Hitung MD5
            var hash = CryptoJS.MD5(dataToHash).toString();
            var shortHash = hash.substring(0, 8).toUpperCase(); // Ambil 8 karakter pertama
            
            var finalKey = dateStr + '-' + shortHash;
            
            document.getElementById('resultKey').textContent = finalKey;
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
