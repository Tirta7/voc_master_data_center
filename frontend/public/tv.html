<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VOC Digital Signage - Videotron</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #videotron-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    /* SLIDESHOW LAYER */
    .slide-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      pointer-events: none;
    }
    .slide-layer.active {
      opacity: 1;
      pointer-events: auto;
    }
    .slide-bg-blur {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(40px);
      opacity: 0.45;
      transform: scale(1.2);
    }
    .slide-img-main {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* GRADIENT VIGNETTES */
    .vignette-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 160px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }
    .vignette-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 320px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }
    /* TOP HEADER */
    .header-bar {
      position: absolute;
      top: 36px;
      left: 48px;
      right: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .ping-dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 12px #ef4444;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: right;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1;
      text-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }
    .brand-sub {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.35em;
      color: #818cf8;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .brand-logo {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    /* LOWER-THIRD CAPTION */
    .caption-box {
      position: absolute;
      bottom: 48px;
      left: 48px;
      max-width: 65%;
      z-index: 20;
      pointer-events: none;
      transition: all 0.5s ease;
    }
    .promo-tag {
      display: inline-block;
      padding: 4px 14px;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(99, 102, 241, 0.5);
      color: #a5b4fc;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 8px;
      backdrop-filter: blur(8px);
    }
    .promo-title {
      font-size: 52px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.05;
      text-shadow: 0 4px 20px rgba(0,0,0,0.95);
      margin-bottom: 8px;
    }
    .promo-desc {
      font-size: 19px;
      font-weight: 700;
      color: #e2e8f0;
      line-height: 1.35;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
      max-width: 90%;
    }
    /* DIGITAL CLOCK */
    .clock-box {
      position: absolute;
      bottom: 48px;
      right: 48px;
      text-align: right;
      z-index: 20;
      pointer-events: none;
    }
    .clock-time {
      font-size: 42px;
      font-weight: 900;
      font-family: monospace;
      letter-spacing: -0.03em;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(0,0,0,0.95);
    }
    .clock-day {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: #818cf8;
      text-transform: uppercase;
      margin-top: 6px;
    }
    /* BOTTOM PROGRESS BAR */
    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 30;
      display: flex;
    }
    .progress-segment {
      flex: 1;
      height: 100%;
      margin: 0 2px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #6366f1;
      box-shadow: 0 0 12px #6366f1;
      transition: width 0.1s linear;
    }
    /* AUTO-HIDE FLOATING CONTROLS */
    .floating-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.3s ease;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    body:hover .floating-bar,
    .floating-bar:focus-within {
      opacity: 1;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: background 0.2s;
    }
    .ctrl-btn:hover {
      background: #6366f1;
    }
    /* RESPONSIVE SCALING */
    @media (max-width: 1024px) {
      .promo-title { font-size: 36px; }
      .promo-desc { font-size: 15px; }
      .clock-time { font-size: 32px; }
      .header-bar { top: 20px; left: 24px; right: 24px; }
      .caption-box { bottom: 28px; left: 24px; }
      .clock-box { bottom: 28px; right: 24px; }
    }
  </style>
</head>
<body>
  <div id="videotron-container" ondblclick="toggleFullscreen()">
    <!-- SLIDES CONTAINER -->
    <div id="slides-wrapper"></div>

    <!-- VIGNETTES -->
    <div class="vignette-top"></div>
    <div class="vignette-bottom"></div>

    <!-- TOP HEADER -->
    <div class="header-bar">
      <div class="live-badge">
        <span class="ping-dot"></span>
        <span id="live-tag">OFFICIAL PROMO</span>
      </div>
      <div class="brand-box">
        <div>
          <div class="brand-name" id="brand-name">COSMO POOL</div>
          <div class="brand-sub">DIGITAL BILLBOARD</div>
        </div>
        <div class="brand-logo" id="brand-logo-container">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
      </div>
    </div>

    <!-- LOWER-THIRD CAPTION -->
    <div class="caption-box">
      <div class="promo-tag" id="promo-tag">SPECIAL PROMO</div>
      <div class="promo-title" id="promo-title">MEMUAT IKLAN...</div>
      <div class="promo-desc" id="promo-desc">Silakan tunggu sebentar, sistem sedang menghubungkan ke server.</div>
    </div>

    <!-- DIGITAL CLOCK -->
    <div class="clock-box">
      <div class="clock-time" id="clock-time">00:00</div>
      <div class="clock-day" id="clock-day">SEN</div>
    </div>

    <!-- BOTTOM PROGRESS TRACK -->
    <div class="progress-track" id="progress-track"></div>

    <!-- FLOATING AUTO-HIDE CONTROLS -->
    <div class="floating-bar">
      <button class="ctrl-btn" onclick="toggleFullscreen()">Layar Penuh (F)</button>
      <button class="ctrl-btn" onclick="nextSlideManual()">Slide Berikutnya &gt;</button>
      <button class="ctrl-btn" onclick="location.reload()">Muat Ulang</button>
    </div>
  </div>

  <script>
    // VANILLA JAVASCRIPT - COMPATIBLE WITH CHROME 45+ & ANDROID 5+ (ZERO DEPENDENCY)
    var SLIDE_DURATION = 8000; // 8 detik per slide
    var activePromos = [];
    var currentIndex = 0;
    var slideTimer = null;
    var progressInterval = null;
    var progressStartTime = Date.now();
    var settingsData = null;

    // Fallback default promos
    var DEFAULT_PROMOS = [
      {
        title: "Happy Hour Special",
        desc: "Diskon 20% untuk semua Menu Cafe setiap jam 10:00 - 15:00",
        tag: "PROMO",
        image: "/promos/happy_hour.png"
      },
      {
        title: "Elite Tournament",
        desc: "Ikuti turnamen mingguan & menangkan hadiah jutaan rupiah!",
        tag: "EVENT",
        image: "/promos/tournament.png"
      },
      {
        title: "Play & Win Points",
        desc: "Kumpulkan loyalty points untuk ditukar hadiah eksklusif!",
        tag: "LOYALTY",
        image: "/promos/membership.png"
      }
    ];

    function resolveImageUrl(path) {
      if (!path) return '';
      if (path.indexOf('http://') === 0 || path.indexOf('https://') === 0) {
        return path;
      }
      if (path.charAt(0) !== '/') path = '/' + path;
      return path + '?v=' + Date.now();
    }

    // UPDATE CLOCK REAL-TIME
    function updateClock() {
      var now = new Date();
      var hours = String(now.getHours());
      if (hours.length < 2) hours = '0' + hours;
      var minutes = String(now.getMinutes());
      if (minutes.length < 2) minutes = '0' + minutes;

      var days = ['MIN', 'SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB'];
      var dayName = days[now.getDay()];

      document.getElementById('clock-time').textContent = hours + ':' + minutes;
      document.getElementById('clock-day').textContent = dayName;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // RENDER SLIDES DOM
    function renderSlidesDom() {
      var wrapper = document.getElementById('slides-wrapper');
      wrapper.innerHTML = '';

      var track = document.getElementById('progress-track');
      track.innerHTML = '';

      for (var i = 0; i < activePromos.length; i++) {
        var p = activePromos[i];
        var slide = document.createElement('div');
        slide.className = 'slide-layer' + (i === currentIndex ? ' active' : '');
        slide.id = 'slide-' + i;

        var imgSrc = resolveImageUrl(p.image);
        slide.innerHTML = 
          '<img class="slide-bg-blur" src="' + imgSrc + '" alt="">' +
          '<img class="slide-img-main" src="' + imgSrc + '" alt="' + (p.title || '') + '" onerror="this.src=\'https://images.unsplash.com/photo-1544178178-50348c32d847?auto=format&fit=crop&q=80&w=1920\'">';

        wrapper.appendChild(slide);

        // Progress segment
        var seg = document.createElement('div');
        seg.className = 'progress-segment';
        seg.innerHTML = '<div class="progress-bar-fill" id="pfill-' + i + '"></div>';
        track.appendChild(seg);
      }
      updateCaption();
    }

    // UPDATE CAPTION TEXT
    function updateCaption() {
      if (activePromos.length === 0) return;
      var cur = activePromos[currentIndex];
      document.getElementById('promo-tag').textContent = cur.tag || 'SPECIAL PROMOTION';
      document.getElementById('promo-title').textContent = cur.title || '';
      document.getElementById('promo-desc').textContent = cur.desc || '';
      document.getElementById('live-tag').textContent = cur.tag || 'OFFICIAL PROMO';
    }

    // SHOW SPECIFIC SLIDE
    function showSlide(index) {
      if (activePromos.length === 0) return;
      currentIndex = index % activePromos.length;

      var layers = document.querySelectorAll('.slide-layer');
      for (var i = 0; i < layers.length; i++) {
        if (i === currentIndex) {
          layers[i].classList.add('active');
        } else {
          layers[i].classList.remove('active');
        }
      }
      updateCaption();
      startProgressAnimation();
    }

    // PROGRESS ANIMATION
    function startProgressAnimation() {
      progressStartTime = Date.now();
      if (progressInterval) clearInterval(progressInterval);

      progressInterval = setInterval(function() {
        var elapsed = Date.now() - progressStartTime;
        var pct = Math.min(100, (elapsed / SLIDE_DURATION) * 100);

        for (var i = 0; i < activePromos.length; i++) {
          var fill = document.getElementById('pfill-' + i);
          if (fill) {
            if (i < currentIndex) {
              fill.style.width = '100%';
            } else if (i === currentIndex) {
              fill.style.width = pct + '%';
            } else {
              fill.style.width = '0%';
            }
          }
        }
      }, 50);
    }

    // NEXT SLIDE
    function nextSlide() {
      showSlide(currentIndex + 1);
    }

    function nextSlideManual() {
      nextSlide();
      restartLoop();
    }

    function restartLoop() {
      if (slideTimer) clearInterval(slideTimer);
      slideTimer = setInterval(nextSlide, SLIDE_DURATION);
      startProgressAnimation();
    }

    // FULLSCREEN TOGGLE
    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        var docEl = document.documentElement;
        if (docEl.requestFullscreen) docEl.requestFullscreen();
        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // KEYBOARD SHORTCUTS
    window.addEventListener('keydown', function(e) {
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlideManual();
    });

    // FETCH SETTINGS REAL-TIME (WORKS WITH PROXY OR DIRECT)
    function fetchSettings() {
      var url = '/api-proxy/settings?_t=' + Date.now();
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            applySettings(data);
          } catch(e) {
            console.error('Parse settings error', e);
          }
        } else {
          // Fallback to /settings directly if not using /api-proxy
          fetchFallbackSettings();
        }
      };
      xhr.onerror = function() {
        fetchFallbackSettings();
      };
      xhr.send();
    }

    function fetchFallbackSettings() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/settings?_t=' + Date.now(), true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            applySettings(data);
          } catch(e) {}
        }
      };
      xhr.send();
    }

    function applySettings(data) {
      settingsData = data;
      if (data.businessName) {
        document.getElementById('brand-name').textContent = data.businessName;
      }
      if (data.logoPath) {
        var logoContainer = document.getElementById('brand-logo-container');
        logoContainer.innerHTML = '<img src="' + resolveImageUrl(data.logoPath) + '" alt="Logo">';
      }

      var newPromos = (data.displayPromotions && data.displayPromotions.length > 0)
        ? data.displayPromotions
        : DEFAULT_PROMOS;

      // Only re-render if count or items changed
      if (JSON.stringify(newPromos) !== JSON.stringify(activePromos)) {
        activePromos = newPromos;
        renderSlidesDom();
        restartLoop();
      }
    }

    // INITIAL LOAD
    activePromos = DEFAULT_PROMOS;
    renderSlidesDom();
    restartLoop();
    fetchSettings();

    // Auto-sync settings every 30 seconds for live admin changes
    setInterval(fetchSettings, 30000);
  </script>
</body>
</html>
