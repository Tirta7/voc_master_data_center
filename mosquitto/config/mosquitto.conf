# ============================================================
# Mosquitto MQTT Broker Configuration
# VOC Billiard System - Production Ready
# ============================================================

# ─── Listeners ───
# Standard MQTT over TCP
listener 1883
protocol mqtt

# MQTT over WebSocket (for web frontend)
listener 8083
protocol websockets
http_dir /mosquitto/config/http

# ─── Persistence ───
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 1800
autosave_on_changes false

# ─── Logging ───
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
# log_type subscribe
# log_type unsubscribe

# ─── Connection Settings ───
max_connections 500
max_keepalive 60
keepalive_interval 60

# ─── Message Settings ───
message_size_limit 1048576
max_inflight_messages 100
max_queued_messages 1000
max_queued_bytes 10485760

# ─── Security ───
# Uncomment after setting up password file
# allow_anonymous false
# password_file /mosquitto/config/pwfile

# ─── WebSocket HTTP Module ───
# Serve static files for WebSocket testing